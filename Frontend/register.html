<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Create Account | JanSahara</title><link rel="stylesheet" href="auth.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%230f2f52%27/%3E%3Ctext x=%2732%27 y=%2740%27 text-anchor=%27middle%27 font-family=%27Arial%27 font-size=%2724%27 font-weight=%27900%27 fill=%27white%27%3EJS%3C/text%3E%3C/svg%3E"><script src="brand.js"></script>
</head><body>
<header class="auth-nav"><a class="logo" href="index.html">Jan<span>Sahara</span></a><a class="back" href="index.html">← Back to home</a></header>
<main class="auth-wrap"><section class="auth-card"><div class="auth-head"><div class="mark">JS</div><h1>Create your account</h1><p>Start building your JanSahara profile.</p></div>
<form id="registerForm"><div class="field"><label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com" required></div><div class="field"><label for="password">Password</label><div class="password-row"><input id="password" type="password" placeholder="Create a password" minlength="6" required><button type="button" class="toggle-pass" data-target="password">Show</button></div></div><div class="field"><label for="confirmPassword">Confirm password</label><div class="password-row"><input id="confirmPassword" type="password" placeholder="Re-enter your password" minlength="6" required><button type="button" class="toggle-pass" data-target="confirmPassword">Show</button></div></div><button class="submit" type="submit">Create Account</button><div id="message" class="message"></div></form>
<div class="divider">NEXT STEP</div><p class="auth-foot">Already have an account? <a class="auth-link" href="login.html">Sign in</a></p><p class="legal">After registration, your profile information can be completed through the JanSahara profile questionnaire.</p></section></main>
<script src="auth.js"></script></body></html>
