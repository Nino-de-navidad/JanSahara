<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sign In | JanSahara</title><link rel="stylesheet" href="auth.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%230f2f52%27/%3E%3Ctext x=%2732%27 y=%2740%27 text-anchor=%27middle%27 font-family=%27Arial%27 font-size=%2724%27 font-weight=%27900%27 fill=%27white%27%3EJS%3C/text%3E%3C/svg%3E"><script src="brand.js"></script>

<header class="auth-nav"><a class="logo" href="index.html">Jan<span>Sahara</span></a><a class="back" href="index.html">← Back to home</a></header>
<main class="auth-wrap"><section class="auth-card"><div class="auth-head"><div class="mark">JS</div><h1>Welcome back</h1><p>Sign in to continue to JanSahara.</p></div>
<form id="loginForm"><div class="field"><label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com" required></div><div class="field"><label for="password">Password</label><div class="password-row"><input id="password" type="password" placeholder="Enter your password" required><button type="button" class="toggle-pass" data-target="password">Show</button></div></div><div class="options"><label class="remember"><input type="checkbox" id="remember"> Remember me</label><a class="auth-link" href="#" id="forgot">Forgot password?</a></div><button class="submit" type="submit">Sign In</button><div id="message" class="message"></div></form>
<div class="divider">JANSAHARA</div><p class="auth-foot">New to JanSahara? <a class="auth-link" href="register.html">Create an account</a></p></section></main>
<script src="auth.js"></script></body></html>
